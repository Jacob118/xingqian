<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>醒签</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✳</span><span>醒签</span><span class="brand-note">留一席给重要的事</span></div>
      <div class="window-actions">
        <button id="minimize" class="icon-button" title="折叠成优先提醒长条" aria-label="折叠成优先提醒长条">—</button>
        <button id="quit" class="icon-button close-button" title="退出醒签" aria-label="退出醒签">×</button>
      </div>
    </header>

    <section id="card-view" class="view">
      <div class="eyebrow"><span class="dot"></span><span id="active-count">正在提醒</span></div>
      <article class="quote-card">
        <span class="quote-mark">“</span>
        <p id="quote-text" class="quote-text"></p>
        <p id="quote-source" class="quote-source"></p>
        <div class="card-bottom"><span id="quote-index" class="quote-index"></span><button id="next-quote" class="text-button">换一句 <span>↗</span></button></div>
      </article>
      <div class="today-row">
        <div class="today-prompt"><div class="today-label">给今天的一点提醒</div><div class="today-copy">不必一次做好所有事，先别忘了什么最重要。</div></div>
        <div class="ambient-widget" aria-label="本地时间和日期">
          <time id="local-time" class="ambient-time">--:--</time>
          <span id="local-date" class="ambient-date"></span>
        </div>
      </div>
      <footer class="footer-row">
        <button id="manage" class="primary-button"><span>＋</span> 管理我的话</button>
        <button id="pin-toggle" class="subtle-button"><span id="pin-icon">⌖</span><span id="pin-label">置顶中</span></button>
      </footer>
      <button id="toggle-themes" class="theme-disclosure home-theme-disclosure" type="button" aria-expanded="false"><span>卡片外观</span><span id="current-theme-name">纸笺</span><span class="disclosure-arrow">⌄</span></button>
      <div id="theme-picker" class="theme-picker home-theme-picker hidden">
        <button class="theme-choice is-selected" type="button" data-theme-option="paper"><span class="theme-swatch theme-paper"></span><span>纸笺</span></button>
        <button class="theme-choice" type="button" data-theme-option="forest"><span class="theme-swatch theme-forest"></span><span>森林夜 <i>⌑</i></span></button>
        <button class="theme-choice" type="button" data-theme-option="rose"><span class="theme-swatch theme-rose"></span><span>暖粉信笺 <i>⌑</i></span></button>
      </div>
    </section>

    <section id="manage-view" class="view hidden">
      <div class="manage-heading"><div><div class="eyebrow"><span class="dot"></span>你的收藏</div><h1>留住那些重要的话</h1></div><button id="back" class="back-button">返回卡片</button></div>
      <div class="manager-tabs" role="tablist" aria-label="管理内容">
        <button class="manager-tab is-active" type="button" data-manager-tab="quotes" aria-selected="true">我留下的</button>
        <button class="manager-tab" type="button" data-manager-tab="packs" aria-selected="false">与思想相逢</button>
      </div>
      <section class="manager-pane" data-manager-pane="quotes">
      <div id="quote-list" class="quote-list"></div>
      <form id="quote-form" class="quote-form">
        <label class="field-label" for="quote-input">添加一句</label>
        <textarea id="quote-input" rows="2" maxlength="500" placeholder="写下最近想记住的话……" required></textarea>
        <div class="form-bottom"><input id="source-input" maxlength="100" placeholder="出处 / 对自己说（可选）"><select id="expiry-input" aria-label="保留时间"><option value="3">保留 3 个月</option><option value="6" selected>保留 6 个月</option><option value="12">保留 1 年</option><option value="">一直保留</option></select></div>
        <div class="form-actions"><button type="submit" class="primary-button add-button">保存这句话 <span>↗</span></button><button id="cancel-edit" type="button" class="cancel-button hidden">取消修改</button></div>
      </form>
      </section>
      <section class="manager-pane hidden" data-manager-pane="packs">
        <p class="packs-intro">展开一页，看看哪句话此刻与你相认。</p>
        <div id="quote-pack-list" class="quote-pack-list"></div>
        <p class="pack-rights-note">外文作品为编者试译；波伏瓦部分是思想转述示例。正式上架前会核对出处与译文授权。</p>
      </section>
      <div class="settings-line">
        <label class="setting"><input id="always-top" type="checkbox"><span class="switch"></span><span>始终置顶</span></label>
        <label class="setting"><input id="login-start" type="checkbox"><span class="switch"></span><span>登录时显示</span></label>
      </div>
      <div class="update-row">
        <div class="update-copy"><span class="update-heading">自动更新</span><span id="update-status" class="update-status">发布更新源后可用</span></div>
        <button id="check-updates" class="update-button" type="button">检查更新</button>
      </div>
      <p class="privacy-note"><span>⌑</span> 内容仅保存在这台电脑上</p>
    </section>
    <button id="compact-view" class="compact-view" type="button" aria-label="展开醒签卡片">
      <span class="compact-dot"></span>
      <span class="compact-label">优先</span>
      <span id="compact-quote" class="compact-quote"></span>
      <span class="compact-expand" aria-hidden="true">↗</span>
    </button>
    <section id="unlock-shelf" class="unlock-shelf hidden" aria-label="解锁内容">
      <div class="shelf-panel" role="dialog" aria-modal="true" aria-labelledby="shelf-title">
        <div class="shelf-topline"><span class="shelf-kicker">醒签 · 解锁收藏</span><button id="close-shelf" class="store-close" type="button" aria-label="关闭">×</button></div>
        <h2 id="shelf-title">解锁这份内容</h2>
        <p id="shelf-description" class="shelf-description"></p>
        <div id="shelf-plans">
          <label class="sku-option is-recommended">
            <input class="sku-radio" type="radio" name="selected-sku" value="annual">
            <span class="sku-tag">年卡</span><span class="sku-detail">主题与完整语录包</span><strong>¥15 <small>/ 年</small></strong>
          </label>
          <label class="sku-option">
            <input class="sku-radio" type="radio" name="selected-sku" value="lifetime">
            <span class="sku-tag">终身会员</span><span class="sku-detail">一次付费，永久使用</span><strong>¥20 <small>一次</small></strong>
          </label>
          <p class="shelf-note">早期方案价格预览，支付接入后再开放购买。</p>
          <button id="purchase-sku" class="purchase-button" type="button" disabled>先选择一个方案</button>
        </div>
        <div id="shelf-payment" class="shelf-payment hidden">
          <div class="payment-code-placeholder" aria-hidden="true">▦</div>
          <b id="payment-plan-label"></b>
          <p>商户支付接入后，这里会显示对应方案的付款二维码。</p>
          <button id="back-to-plans" class="back-to-plans" type="button">返回方案</button>
        </div>
      </div>
    </section>
    <div id="toast" role="status" class="toast"></div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
