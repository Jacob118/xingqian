name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      has_mac_assets: ${{ steps.release.outputs.has_mac_assets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            core.setOutput('version', version);
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `v${version}`
              });
              core.setOutput('has_mac_assets', release.assets.some(asset => asset.name.toLowerCase().endsWith('.dmg')) ? 'true' : 'false');
              core.setOutput('already-published', release.draft ? 'false' : 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('has_mac_assets', 'false');
              core.setOutput('already-published', 'false');
            }
      - if: steps.release.outputs.already-published != 'true'
        run: npm ci
      - if: steps.release.outputs.already-published != 'true'
        name: Build and publish Windows installer
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ github.token }}
          XINGQIAN_GITHUB_OWNER: ${{ github.repository_owner }}
          XINGQIAN_GITHUB_REPO: ${{ github.event.repository.name }}
      - if: steps.release.outputs.already-published != 'true'
        name: Publish release and remove duplicate drafts
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.APP_VERSION}`;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const matching = releases.filter(release => release.tag_name === tag);
            const installerName = `xingqian-desktop-setup-${process.env.APP_VERSION}.exe`;
            const hasInstaller = release => release.assets.some(asset => asset.name === installerName)
              && release.assets.some(asset => asset.name === 'latest.yml');
            let selected = matching.find(release => !release.draft && hasInstaller(release));
            if (!selected) selected = matching.find(release => release.draft && hasInstaller(release));
            if (!selected) {
              throw new Error(`No ${tag} release contains both ${installerName} and latest.yml.`);
            }
            if (selected.draft) {
              const { data } = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: selected.id,
                draft: false
              });
              selected = data;
            }
            for (const release of matching) {
              if (release.draft && release.id !== selected.id) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
              }
            }
            core.info(`Published ${selected.html_url}`);

  macos:
    needs: publish
    if: needs.publish.outputs.version != '' && needs.publish.outputs.has_mac_assets != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Intel and Apple silicon disk images
        run: npx electron-builder --mac dmg --config electron-builder.config.cjs --x64 --arm64 --publish never
      - name: Upload disk images to the public release
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ needs.publish.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const directory = 'release';
            const files = fs.readdirSync(directory).filter(name => name.toLowerCase().endsWith('.dmg'));
            if (files.length === 0) throw new Error('The macOS build did not produce a DMG.');
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: `v${process.env.APP_VERSION}`
            });
            for (const name of files) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                data: fs.createReadStream(path.join(directory, name)),
                headers: {
                  'content-type': 'application/x-apple-diskimage',
                  'content-length': fs.statSync(path.join(directory, name)).size
                }
              });
            }
